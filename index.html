<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bi_minis</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #1a1f2b;
    --panel-hover: #232a39;
    --border: #2a3142;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  header { padding: 40px 16px 12px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin-top: 6px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  a.tile {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 130px; padding: 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: transform .15s, background .15s, border-color .15s;
  }
  a.tile:hover { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-2px); }
  .tile .name { font-size: 1.15rem; font-weight: 600; word-break: break-word; }
  .tile .folder { color: var(--muted); font-size: .8rem; margin-top: 4px; font-family: ui-monospace, Consolas, monospace; }
  .tile .date { color: var(--muted); font-size: .85rem; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>bi_<span>minis</span></h1>
  <div class="sub">Schnelle Mini-Projekte für den situativen Einsatz</div>
</header>
<main>
  <div id="grid" class="grid"></div>
</main>

<script>
  // Neue Minis hier eintragen (neueste zuerst): Ordnername, Anzeigename, Erstelldatum.
  const projects = [
    { folder: 'sql-begriffe', name: 'SQL-Begriffe trainieren', created: '2026-10-25' },
  ];

  const grid = document.getElementById('grid');
  for (const p of projects) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = p.folder + '/index.html';

    const top = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = p.name;
    const folder = document.createElement('div');
    folder.className = 'folder';
    folder.textContent = p.folder + '/';
    top.append(name, folder);

    const date = document.createElement('div');
    date.className = 'date';
    date.textContent = 'Erstellt: ' + new Date(p.created).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

    a.append(top, date);
    grid.appendChild(a);
  }
</script>
</body>
</html>
