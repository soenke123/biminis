<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch – Blöcke üben</title>
<style>
:root {
  --bg: #f4f6fb; --panel: #ffffff; --panel2: #f0f3fa; --line: #dde3ef;
  --text: #1c2540; --muted: #667089; --accent: #4c97ff; --accent-ink: #ffffff; --accent-soft: #e5f0ff;
  --green: #138a5e; --green-soft: #e3f6ee; --red: #d6364a; --red-soft: #fdeaed;
  --shadow: 0 1px 2px rgba(28,37,64,.06), 0 6px 20px rgba(28,37,64,.06);
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1200px 400px at 50% -100px, #dbe9ff 0%, transparent 70%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; min-height: 100vh; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #9cc3ff; outline-offset: 2px; }
.wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
header { padding: 30px 0 18px; }
.eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; font-weight: 800; }
h1 { margin: 4px 0 4px; font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.15; letter-spacing: -.02em; }
.subtitle { color: var(--muted); margin: 0; }
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 22px; background: rgba(255,255,255,.88); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.seg { display: inline-flex; background: var(--panel2); border-radius: 11px; padding: 3px; gap: 2px; }
.mode-btn { background: transparent; border: 0; color: var(--muted); padding: 8px 16px; border-radius: 9px; font-weight: 700; }
.mode-btn:hover { color: var(--text); }
.mode-btn[aria-pressed="true"] { background: var(--panel); color: #2f6fd6; box-shadow: 0 1px 3px rgba(28,37,64,.15); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 13px; color: var(--muted); font-size: .9rem; }
.stat strong { color: var(--text); }
.primary-btn { background: #3d85f0; color: var(--accent-ink); border: 1px solid #2f6fd6; border-radius: 10px; padding: 9px 18px; font-weight: 750; transition: filter .12s, transform .12s; }
.primary-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
.primary-btn:disabled { opacity: .45; cursor: not-allowed; }
.secondary-btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.secondary-btn:hover:not(:disabled) { border-color: var(--accent); color: #2f6fd6; }
.secondary-btn:disabled { opacity: .45; cursor: not-allowed; }
main { padding-bottom: 48px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 1.15rem; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.pill { display: inline-block; color: #2f6fd6; background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
.pill.cat { color: #fff; }
.question-number { color: #2f6fd6; font-size: .85rem; font-weight: 800; letter-spacing: .06em; }
.progress-track { height: 7px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 12px 0 14px; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4c97ff, #9966ff); border-radius: 99px; transition: width .25s; }
.question { font-size: clamp(1.1rem, 2vw, 1.35rem); line-height: 1.45; font-weight: 700; margin: 10px 0 6px; }
.hint { color: var(--muted); font-size: .9rem; margin: 0 0 4px; }
.action-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
.feedback { border-radius: 12px; padding: 12px 14px; margin: 18px 0 4px; border: 1px solid var(--line); }
.feedback.good { color: #0e6b49; border-color: #9fdcc3; background: var(--green-soft); }
.feedback.bad { color: #a82437; border-color: #f2b5bd; background: var(--red-soft); }
.feedback strong { display: block; font-size: 1.05rem; margin-bottom: 2px; }
.feedback p { margin: 0; color: var(--text); }
.feedback .sol-label { margin-top: 10px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.feedback .list { margin-top: 6px; }

/* Setup / Ende */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 6px; }
.chip { border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 16px; font-weight: 750; color: var(--text); display: inline-flex; align-items: center; gap: 9px; transition: transform .12s, border-color .12s, box-shadow .12s; }
.chip:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(28,37,64,.1); }
.chip[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 3px rgba(28,37,64,.1); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot, #999); border: 1px solid rgba(0,0,0,.18); flex: none; }
.completion { text-align: center; padding: 20px 6px; }
.completion h2 { font-size: 1.7rem; }
.completion .score { font-size: 3rem; font-weight: 900; color: #2f6fd6; margin: 4px 0; }
.bars { max-width: 460px; margin: 18px auto; text-align: left; display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: .9rem; }
.bar-track { height: 12px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--bar, #4c97ff); border-radius: 99px; }
.pop { display: inline-block; animation: pop .4s ease-out; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.25); } to { transform: scale(1); opacity: 1; } }

/* Antwort-Optionen */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-top: 16px; }
.opt { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px 14px; display: flex; align-items: center; justify-content: flex-start; min-height: 70px; text-align: left; overflow-x: auto; transition: border-color .12s, transform .12s, background .12s; color: var(--text); }
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.opt.sel { border-color: #2f6fd6; background: var(--accent-soft); }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.missed { border-color: var(--green); border-style: dashed; }
.opt:disabled { cursor: default; }
.txt-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.txt-opt { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 750; color: var(--text); transition: border-color .12s, transform .12s; }
.txt-opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.txt-opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.txt-opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.txt-opt.missed { border-color: var(--green); border-style: dashed; }
.txt-opt:disabled { cursor: default; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; margin-top: 16px; }
.card { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px 16px; background: var(--panel2); min-width: 0; overflow-x: auto; }
.card.pickable { cursor: pointer; }
.card.pickable:hover { border-color: var(--accent); }
.card.sel { border-color: #2f6fd6; background: var(--accent-soft); }
.card.wrong { border-color: var(--red); background: var(--red-soft); }
.card.missed { border-color: var(--green); border-style: dashed; }
.txt-opt.sel { border-color: #2f6fd6; background: var(--accent-soft); }
.num-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.num-in { font: 800 1.4rem/1 system-ui, sans-serif; width: 180px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; text-align: center; color: var(--text); background: var(--panel); }
.num-in:focus { outline: none; border-color: var(--accent); }
.num-in.good { border-color: var(--green); background: var(--green-soft); }
.num-in.bad { border-color: var(--red); background: var(--red-soft); }
.findable .blk { cursor: pointer; }
.blk.picked > svg.bg path { stroke: #2f6fd6; stroke-width: 3.5; }
.blk.good > svg.bg path { stroke: #138a5e; stroke-width: 3.5; }
.blk.wrong > svg.bg path { stroke: #d6364a; stroke-width: 3.5; }
.blk.missed > svg.bg path { stroke: #138a5e; stroke-width: 3.5; stroke-dasharray: 6 3; }
.blk.reporter.picked { box-shadow: 0 0 0 3px #2f6fd6; }
.blk.reporter.good { box-shadow: 0 0 0 3px #138a5e; }
.blk.reporter.wrong { box-shadow: 0 0 0 3px #d6364a; }
.blk.reporter.missed { box-shadow: 0 0 0 3px #138a5e; }
.card.ok { border-color: var(--green); background: var(--green-soft); }
.card h4 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .1em; color: var(--muted); }
.card.ok h4 { color: var(--green); }
.single { margin-top: 16px; }

/* Bausteine im Original-Scratch-Look */
.blk { --c: #4C97FF; --c2: #4280D7; --c3: #3373CC; position: relative; isolation: isolate; color: #fff; font: 600 14px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; text-shadow: 0 1px 0 rgba(0,0,0,.2); user-select: none; -webkit-user-select: none; flex: none; }
.blk > svg.bg { position: absolute; left: 0; top: 0; overflow: visible; z-index: -1; pointer-events: none; }
.blk > svg.bg path { fill: var(--c); stroke: var(--c3); stroke-width: 1; }
.blk.empty > svg.bg path { fill: var(--c3); }
.blk.stack, .blk.hat, .blk.cap, .blk.c { display: flex; flex-direction: column; width: fit-content; min-width: 60px; }
.blk .row { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; min-height: 40px; white-space: nowrap; }
.blk.hat { min-width: 110px; }
.blk.hat .row.top { min-height: 58px; padding-top: 18px; }
.blk.c .row.mid { min-height: 32px; }
.blk.c .row.arm { min-height: 24px; }
.blk .mouth { margin-left: 16px; min-height: 24px; display: flex; flex-direction: column; align-items: flex-start; }
.blk.reporter { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 15px; background: var(--c); border: 1px solid var(--c3); white-space: nowrap; }
.blk.bool { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 17px; white-space: nowrap; }
.blk.bool.empty { min-width: 38px; min-height: 26px; }
.lbl { white-space: nowrap; }
.ico { display: inline-flex; align-items: center; font-size: 19px; line-height: 1; }
.fld { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 26px; padding: 0 9px; background: #fff; color: #575E75; border: 1px solid var(--c3); border-radius: 14px; font: inherit; text-shadow: none; white-space: pre; text-align: center; }
.fld.t { border-radius: 9px; }
input.fld { outline: none; user-select: text; -webkit-user-select: text; }
input.fld:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
.dd { position: relative; display: inline-flex; align-items: center; height: 26px; padding: 0 22px 0 9px; background: var(--c2); border: 1px solid var(--c3); border-radius: 8px; white-space: nowrap; }
.dd::after { content: "▾"; position: absolute; right: 7px; top: 50%; transform: translateY(-52%); font-size: 12px; pointer-events: none; }
.dd select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.sw { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #fff; display: inline-block; }
.list { display: flex; flex-direction: column; align-items: flex-start; }
.draggable .blk { cursor: grab; touch-action: none; }
.ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: .95; filter: drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
.dropind { position: fixed; z-index: 999; pointer-events: none; background: #fff; box-shadow: 0 0 0 2px #2f6fd6; border-radius: 3px; }
.dropind.line { height: 6px; background: #2f6fd6; box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.dropind.box { background: transparent; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #2f6fd6; border-radius: 12px; }

/* Bau-Aufgabe */
.build { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; margin-top: 16px; }
.build h4 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.palette { background: var(--panel2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-height: 220px; overflow-x: auto; }
.ws { border: 2px dashed #b8c6e0; border-radius: 14px; padding: 14px 14px 30px; min-height: 260px; overflow-x: auto; background-color: #fbfcff; background-image: radial-gradient(#d5def0 1px, transparent 1px); background-size: 18px 18px; position: relative; }
.ws .list.root { min-height: 220px; width: 100%; }
.ws .placeholder { color: var(--muted); font-size: .9rem; position: absolute; left: 0; right: 0; top: 50%; text-align: center; transform: translateY(-50%); pointer-events: none; padding: 0 20px; }
.ws.done { opacity: .85; }
@media (max-width: 760px) { .build { grid-template-columns: 1fr; } }

/* Übersicht */
.ov-cat { margin-top: 22px; }
.ov-cat h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 1.05rem; }
.ov-grid { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start; }
.sel-label { margin: 16px 0 0; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.ov-item { position: relative; }
.badge { position: absolute; top: -4px; right: -4px; font-size: 16px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.rate-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.rate-btn { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; color: var(--text); }
.rate-btn:hover { border-color: var(--accent); }
.rate-btn[aria-pressed="true"] { border-color: var(--text); background: var(--panel2); box-shadow: 0 0 0 2px rgba(28,37,64,.12); }
.ov-item { background: transparent; border: 2px solid transparent; border-radius: 12px; padding: 6px 8px 10px; text-align: left; transition: background .12s, border-color .12s; }
.ov-item:hover, .ov-item.active { background: var(--panel2); border-color: var(--line); }
.sheet { max-height: 70vh; overflow-y: auto; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; max-width: 640px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: 0 12px 40px rgba(28,37,64,.28); animation: up .16s ease-out; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .blk { margin: 4px 0 10px; }
.sheet p { margin: 0 0 8px; }
.sheet .x { position: absolute; top: 8px; right: 10px; background: transparent; border: 0; font-size: 1.3rem; color: var(--muted); }
.sheet .tag { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
footer { color: var(--muted); font-size: .82rem; text-align: center; padding: 20px; }
@media (max-width: 560px) { .wrap { width: calc(100% - 22px); } .panel { padding: 15px; } .seg { width: 100%; } .mode-btn { flex: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Informatik · Programmieren mit Scratch</div>
    <h1>Scratch-Blöcke üben</h1>
    <p class="subtitle">Erkenne die richtigen Bausteine, vergleiche Skripte und baue kleine Programme.</p>
  </header>
  <nav class="toolbar" aria-label="Steuerung">
    <div class="seg" role="group" aria-label="Modus auswählen">
      <button class="mode-btn" id="refMode" aria-pressed="true">Bausteine</button>
      <button class="mode-btn" id="quizMode" aria-pressed="false">Quiz</button>
    </div>
    <div class="stats" id="stats"></div>
  </nav>
  <main id="app"></main>
  <footer>Die Aufgaben werden bei jedem Start zufällig gemischt. Baustein-Farben und -Formen wie im echten Scratch 3.</footer>
</div>
<script>
'use strict';

/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= Kategorien (Original-Scratch-Farben) ================= */
const CATS = {
  motion:    { n: 'Bewegung',   c: '#4C97FF', c2: '#4280D7', c3: '#3373CC' },
  looks:     { n: 'Aussehen',   c: '#9966FF', c2: '#855CD6', c3: '#774DCB' },
  events:    { n: 'Ereignisse', c: '#FFBF00', c2: '#E6AC00', c3: '#CC9900' },
  control:   { n: 'Steuerung',  c: '#FFAB19', c2: '#EC9C13', c3: '#CF8B17' },
  sensing:   { n: 'Fühlen',     c: '#5CB1D6', c2: '#47A8D1', c3: '#2E8EB8' },
  operators: { n: 'Operatoren', c: '#59C059', c2: '#46B946', c3: '#389438' },
  variables: { n: 'Variablen',  c: '#FF8C1A', c2: '#FF8000', c3: '#DB6E00' },
};

/* ================= Block-Bibliothek ================= */
// shape: hat | stack | cap | c | reporter | bool
// Teile: String = Beschriftung, {n:Zahlenfeld} {t:Textfeld} {d:[Optionen]} {b:Bool-Slot} {c:Farbe} {m:Mund (C-Block)} {i:Icon}
const KEYS = ['Leertaste', 'Pfeil nach oben', 'Pfeil nach unten', 'Pfeil nach rechts', 'Pfeil nach links', 'a'];
const TOUCH = ['Mauszeiger', 'Rand'];
const VARS = ['Punkte', 'Leben'];
const MSGS = ['Nachricht1', 'Nachricht2'];
const L = {};
function def(id, cat, shape, parts, d, extra) { L[id] = Object.assign({ id, cat, shape, parts, d }, extra); }
const isStr = p => typeof p === 'string';
const isInput = p => !isStr(p) && ('n' in p || 't' in p || 'd' in p || 'b' in p || 'c' in p);
function defaultOf(p) { if ('n' in p) return p.n; if ('t' in p) return p.t; if ('d' in p) return p.d[0]; if ('c' in p) return p.c; return null; }
const inputParts = d => d.parts.filter(isInput);

// Bewegung
def('move', 'motion', 'stack', ['gehe ', { n: 10 }, ' er Schritt'], 'Bewegt die Figur um so viele Schritte in die Richtung, in die sie gerade schaut. Mit einer negativen Zahl geht sie rückwärts.');
def('turnR', 'motion', 'stack', ['drehe ', { i: '↻' }, ' um ', { n: 15 }, ' Grad'], 'Dreht die Figur im Uhrzeigersinn (nach rechts) um die angegebene Gradzahl.');
def('turnL', 'motion', 'stack', ['drehe ', { i: '↺' }, ' um ', { n: 15 }, ' Grad'], 'Dreht die Figur gegen den Uhrzeigersinn (nach links) um die angegebene Gradzahl.');
def('goto', 'motion', 'stack', ['gehe zu ', { d: ['Zufallsposition', 'Mauszeiger'] }], 'Setzt die Figur sofort an eine zufällige Stelle oder zum Mauszeiger.');
def('gotoxy', 'motion', 'stack', ['gehe zu x: ', { n: 0 }, ' y: ', { n: 0 }], 'Setzt die Figur sofort auf eine genaue Stelle der Bühne (x = links/rechts, y = oben/unten).');
def('glide', 'motion', 'stack', ['gleite in ', { n: 1 }, ' Sek. zu x: ', { n: 0 }, ' y: ', { n: 0 }], 'Lässt die Figur in der angegebenen Zeit sanft zu einer Stelle gleiten – man sieht die Bewegung.');
def('dir', 'motion', 'stack', ['setze Richtung auf ', { n: 90 }, ' Grad'], 'Stellt die Blickrichtung fest ein: 90 = rechts, -90 = links, 0 = oben, 180 = unten.');
def('pointTo', 'motion', 'stack', ['drehe dich zu ', { d: ['Mauszeiger', 'Zufallsrichtung'] }], 'Dreht die Figur so, dass sie zum Mauszeiger (oder in eine zufällige Richtung) schaut.');
def('changeX', 'motion', 'stack', ['ändere x um ', { n: 10 }], 'Verschiebt die Figur waagerecht: positive Zahl nach rechts, negative nach links.');
def('setX', 'motion', 'stack', ['setze x auf ', { n: 0 }], 'Setzt nur die x-Position (links/rechts) fest. Die y-Position bleibt gleich.');
def('changeY', 'motion', 'stack', ['ändere y um ', { n: 10 }], 'Verschiebt die Figur senkrecht: positive Zahl nach oben, negative nach unten.');
def('setY', 'motion', 'stack', ['setze y auf ', { n: 0 }], 'Setzt nur die y-Position (oben/unten) fest. Die x-Position bleibt gleich.');
def('bounce', 'motion', 'stack', ['pralle vom Rand ab'], 'Wenn die Figur den Rand der Bühne berührt, dreht sie um und läuft zurück.');

// Instanz erzeugen: Werte der Reihe nach, Arrays = Inhalt der C-Block-Münder
function K(id, ...args) {
  const d = L[id]; if (!d) throw new Error('Unbekannter Block ' + id);
  const vals = args.filter(a => !Array.isArray(a)), lists = args.filter(Array.isArray);
  const inst = { id, v: [], m: [] };
  let vi = 0, mi = 0;
  for (const p of d.parts) {
    if (isStr(p) || 'i' in p) continue;
    if ('m' in p) { inst.m.push(lists[mi++] || []); continue; }
    const a = vals[vi++];
    inst.v.push(a === undefined ? defaultOf(p) : a);
  }
  return inst;
}
const clone = x => JSON.parse(JSON.stringify(x));
const isInst = x => x && typeof x === 'object';

function iconEl(name) {
  const s = el('span', 'ico');
  if (name === 'flag') {
    const sv = svgEl('svg', { width: 20, height: 22, viewBox: '0 0 20 22' });
    sv.append(svgEl('path', { d: 'M4.5 2V20', stroke: '#3D9B46', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }));
    sv.append(svgEl('path', { d: 'M5 3.5C8.5 1.5 11 5.5 16 3.5V12C11 14 8.5 10 5 12Z', fill: '#4CBF56', stroke: '#3D9B46', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
    s.append(sv);
  } else s.textContent = name;
  return s;
}

function renderBlock(inst, ctx) {
  const d = L[inst.id], cat = CATS[d.cat];
  const e = el('div', 'blk ' + d.shape);
  e.dataset.shape = d.shape; e._inst = inst;
  e.style.setProperty('--c', cat.c); e.style.setProperty('--c2', cat.c2); e.style.setProperty('--c3', cat.c3);
  const flow = d.shape === 'reporter' || d.shape === 'bool';
  if (d.shape !== 'reporter') { const sv = svgEl('svg', { class: 'bg' }); sv.append(svgEl('path', {})); e.append(sv); }
  let target = flow ? e : el('div', 'row');
  let vi = 0, mi = 0, first = true;
  for (const p of d.parts) {
    if (isStr(p)) { if (p.trim()) target.append(el('span', 'lbl', p.trim())); continue; }
    if ('i' in p) { target.append(iconEl(p.i)); continue; }
    if ('m' in p) {
      target.classList.add(first ? 'top' : 'mid'); first = false; e.append(target);
      const mouth = el('div', 'mouth list');
      const arr = inst.m[mi++];
      arr.forEach(b => mouth.append(renderBlock(b, ctx)));
      if (ctx.lists) ctx.lists.push({ el: mouth, arr });
      e.append(mouth);
      target = el('div', 'row');
      continue;
    }
    const idx = vi++, val = inst.v[idx];
    let node;
    if ('b' in p) {
      if (isInst(val)) node = renderBlock(val, ctx);
      else {
        node = el('div', 'blk bool empty'); node.dataset.shape = 'bool';
        node.style.setProperty('--c', cat.c3); node.style.setProperty('--c3', cat.c3);
        const sv = svgEl('svg', { class: 'bg' }); sv.append(svgEl('path', {})); node.append(sv);
      }
      if (ctx.slots) ctx.slots.push({ el: node, inst, idx, kind: 'b' });
    } else if ('d' in p) {
      node = dropdownEl(p, inst, idx, ctx);
    } else if ('c' in p) {
      node = el('span', 'sw'); node.style.background = val;
    } else {
      node = isInst(val) ? renderBlock(val, ctx) : fieldEl('t' in p ? 't' : 'n', inst, idx, ctx);
      if (ctx.slots) ctx.slots.push({ el: node, inst, idx, kind: 'r' });
    }
    target.append(node);
  }
  if (!flow) {
    if (d.shape === 'c') target.classList.add(target.children.length ? 'mid' : 'arm');
    else target.classList.add('top');
    e.append(target);
  }
  return e;
}

function fieldEl(kind, inst, idx, ctx) {
  const val = String(inst.v[idx]);
  if (!ctx.edit) return el('span', 'fld ' + kind, val);
  const i = el('input', 'fld ' + kind);
  i.type = 'text'; i.value = val; i.spellcheck = false; i.autocomplete = 'off';
  const fit = () => { i.style.width = 'calc(' + Math.max(1, i.value.length) + 'ch + 20px)'; };
  fit();
  i.addEventListener('input', () => { inst.v[idx] = i.value; fit(); if (ctx.onChange) ctx.onChange(); });
  return i;
}

function dropdownEl(p, inst, idx, ctx) {
  const val = inst.v[idx];
  const w = el('span', 'dd');
  w.append(el('span', null, val));
  if (ctx.edit) {
    const s = el('select');
    p.d.forEach(o => { const op = el('option', null, o); op.value = o; if (o === val) op.selected = true; s.append(op); });
    s.addEventListener('change', () => { inst.v[idx] = s.value; w.firstChild.textContent = s.value; if (ctx.onChange) ctx.onChange(); });
    w.append(s);
  }
  return w;
}

/* ---- Form der Bausteine als SVG-Pfad ---- */
const HAT = 18;
const dent = (x, y) => [[x, y], [x + 4, y + 5], [x + 24, y + 5], [x + 28, y]];
const bump = (x, y) => [[x + 28, y], [x + 24, y + 5], [x + 4, y + 5], [x, y]];
function roundedPath(pts, R) {
  const p = pts.filter((q, i) => { const n = pts[(i + 1) % pts.length]; return q[0] !== n[0] || q[1] !== n[1]; });
  const n = p.length; let d = '';
  for (let i = 0; i < n; i++) {
    const c = p[i], a = p[(i + n - 1) % n], b = p[(i + 1) % n];
    const l1 = Math.hypot(a[0] - c[0], a[1] - c[1]), l2 = Math.hypot(b[0] - c[0], b[1] - c[1]);
    const r = Math.min(R, l1 / 2, l2 / 2);
    const s = [c[0] + (a[0] - c[0]) / l1 * r, c[1] + (a[1] - c[1]) / l1 * r];
    const t = [c[0] + (b[0] - c[0]) / l2 * r, c[1] + (b[1] - c[1]) / l2 * r];
    d += (i ? 'L' : 'M') + s[0].toFixed(1) + ' ' + s[1].toFixed(1) + 'Q' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ' + t[0].toFixed(1) + ' ' + t[1].toFixed(1);
  }
  return d + 'Z';
}
function hatCurve() {
  const P = [[0, HAT], [25, HAT - 22], [71, HAT - 22], [96, HAT]], pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, u = 1 - t;
    pts.push([0, 1].map(k => u * u * u * P[0][k] + 3 * u * u * t * P[1][k] + 3 * u * t * t * P[2][k] + t * t * t * P[3][k]));
  }
  return pts;
}
function layoutOne(e) {
  const shape = e.dataset.shape;
  if (shape === 'reporter') return;
  const svg = e.querySelector(':scope > svg.bg'); if (!svg) return;
  const W = e.offsetWidth, H = e.offsetHeight;
  if (!W || !H) return;
  const nobump = e._inst && L[e._inst.id].nobump;
  let pts, R = 4;
  if (shape === 'bool') {
    pts = [[H / 2, 0], [W - H / 2, 0], [W, H / 2], [W - H / 2, H], [H / 2, H], [0, H / 2]]; R = 3;
  } else if (shape === 'c') {
    const segs = [...e.children].filter(k => k.tagName.toLowerCase() !== 'svg')
      .map(k => ({ t: k.classList.contains('mouth') ? 'mouth' : 'row', top: k.offsetTop, h: k.offsetHeight }));
    pts = [[0, 0], ...dent(16, 0), [W, 0]];
    segs.forEach((s, i) => {
      if (s.t === 'mouth') { pts.push([W, s.top], ...bump(32, s.top), [16, s.top], [16, s.top + s.h]); }
      else { if (i > 0) pts.push([W, s.top]); pts.push([W, s.top + s.h]); }
    });
    pts.push([W, H]);
    if (!nobump) pts.push(...bump(16, H));
    pts.push([0, H]);
  } else {
    pts = shape === 'hat' ? [...hatCurve(), [W, HAT], [W, H]] : [[0, 0], ...dent(16, 0), [W, 0], [W, H]];
    if (!nobump) pts.push(...bump(16, H));
    pts.push([0, H]);
  }
  svg.setAttribute('width', W); svg.setAttribute('height', H + 6);
  svg.firstChild.setAttribute('d', roundedPath(pts, R));
}
function layout(root) { root.querySelectorAll('.blk').forEach(layoutOne); }

/* Welche Bausteine kommen in einer Aufgabe vor? (für die Auswahl nach Selbsteinschätzung) */
function idsIn(x, out) {
  if (Array.isArray(x)) x.forEach(i => idsIn(i, out));
  else if (x && x.blocks) idsIn(x.blocks, out);
  else if (isInst(x)) { out.add(x.id); x.v.forEach(v => idsIn(v, out)); x.m.forEach(m => idsIn(m, out)); }
  return out;
}
function taskIds(t) {
  if (!t.ids) {
    const o = new Set();
    if (t.type === 'pick') idsIn(t.opts.filter(x => x.ok).map(x => x.b), o);
    else if (t.type === 'cmp') idsIn(t.scripts, o);
    else if (t.type === 'build') idsIn(t.sol, o);
    else idsIn(t.sc, o);
    t.ids = o;
  }
  return t.ids;
}

function saveRating() { try { localStorage.setItem('scratch-bloecke-rating', JSON.stringify(rating)); } catch (e) { /* ohne Speicher weiter */ } }
const levelOf = id => rating[id] || 'new';

const PRAISE = ['Richtig!', 'Super!', 'Stark!', 'Genau!', 'Perfekt!', 'Klasse!'];

/* ================= Setup ================= */
function showSetup() {
  quiz = null; renderStats();
  app.textContent = '';
  const p = el('section', 'panel');
  p.append(el('h2', null, 'Was möchtest du üben?'));
  p.append(el('p', 'muted', 'Klicke Themen und Selbsteinschätzungen an oder ab – du bekommst nur Aufgaben, die zu deiner Auswahl passen.'));

  p.append(el('div', 'sel-label', 'Themen'));
  const cats = el('div', 'chips');
  const info = el('p', 'hint');
  const go = el('button', 'primary-btn', '▶ Los geht’s'); go.type = 'button';
  const refresh = () => {
    const n = pool().length;
    info.textContent = n ? n + ' passende Aufgaben (eine Runde hat höchstens 15).' : 'Keine Aufgabe passt zu dieser Auswahl – aktiviere mehr Themen oder Stufen.';
    go.disabled = !n;
  };
  const chip = (set, key, name, dotColor, parent) => {
    const b = el('button', 'chip'); b.type = 'button';
    b.setAttribute('aria-pressed', set.has(key));
    const dot = el('span', 'dot'); dot.style.background = dotColor; b.append(dot, name);
    b.addEventListener('click', () => { if (set.has(key)) set.delete(key); else set.add(key); b.setAttribute('aria-pressed', set.has(key)); refresh(); });
    parent.append(b);
  };
  Object.keys(CATS).forEach(k => chip(selCats, k, CATS[k].n, CATS[k].c, cats));
  p.append(cats);

  p.append(el('div', 'sel-label', 'Meine Selbsteinschätzung'));
  const lvs = el('div', 'chips');
  LEVELS.forEach(([k, emoji, name, color]) => {
    const n = Object.keys(L).filter(id => levelOf(id) === k).length;
    chip(selLv, k, emoji + ' ' + name + ' (' + n + ')', color, lvs);
  });
  p.append(lvs);

  toggleAll('Alles aktivieren', () => { Object.keys(CATS).forEach(k => selCats.add(k)); LEVELS.forEach(l => selLv.add(l[0])); });
  toggleAll('Nur Unsicheres', () => { selLv.clear(); selLv.add('no'); selLv.add('mid'); });
  p.append(quick);

  go.addEventListener('click', startQuiz);
  const row = el('div', 'action-row'); row.append(go); p.append(row);

}
function pool() {
  return T.filter(t => selCats.has(t.cat) && [...taskIds(t)].some(id => selLv.has(levelOf(id))));
}

function startQuiz() {
  // Aufgabentypen abwechselnd mischen, damit nicht nur Anklick-Aufgaben kommen
  const q = {};
  shuffle(pool()).forEach(t => (q[t.type] = q[t.type] || []).push(t));
  const order = ['pick', 'build', 'num', 'cmp', 'find', 'pick', 'pred', 'build', 'num', 'find', 'cmp', 'pick'];
  const tasks = [];
  while (tasks.length < 15 && Object.values(q).some(a => a.length)) {
    for (const ty of order) { if (q[ty] && q[ty].length && tasks.length < 15) tasks.push(q[ty].shift()); }
  }
  quiz = { tasks: shuffle(tasks), i: 0, score: 0, streak: 0, right: 0, results: [], finished: false, done: false };
  showTask();
}

/* ================= Aufgabe anzeigen ================= */
function showTask() {
  closeSheet();

  next.addEventListener('click', () => { quiz.i++; showTask(); });

function question(ctx, text, hint) {
  ctx.body.append(el('p', 'question', text));
  if (hint) ctx.body.append(el('p', 'hint', hint));
}

/* Ergebnis melden */
function report(ctx, ok, partial, extra) {
  const t = ctx.t;
  quiz.done = true;
  let pts = 0;
  if (ok) { pts = 10 + 2 * Math.min(quiz.streak, 5); quiz.score += pts; quiz.streak++; quiz.right++; } else quiz.streak = 0;
  quiz.results.push({ cat: t.cat, ok });
  renderStats();
  const fb = ctx.fb;
  fb.className = 'feedback ' + (ok ? 'good' : 'bad');
  fb.textContent = '';
  const s = el('strong');
  if (ok) { const b = el('span', 'pop', '🎉'); s.append(b, ' ' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' +' + pts + ' Punkte'); }
  else s.textContent = partial || 'Nicht ganz.';
  fb.append(s);
  if (t.ex) fb.append(el('p', null, t.ex));
  if (extra) extra(fb);
  ctx.next.classList.remove('hidden');
  ctx.next.focus({ preventScroll: true });
  layout(fb);
}

function normSc(x) { return x.length && x[0] && x[0].blocks ? x : [{ blocks: x }]; }
function scriptsView(x) {
  const w = el('div', 'cmp');
  normSc(x).forEach(s => {
    const c = el('div', 'card');
    if (s.label) c.append(el('h4', null, s.label.toUpperCase()));
    c.append(scriptEl(s.blocks)); w.append(c);
  });
  return w;
}
function mkCheck(ctx, run) {
  const b = el('button', 'primary-btn', 'Überprüfen'); b.type = 'button'; b.disabled = true;
  b.addEventListener('click', () => { if (quiz.done || b.disabled) return; b.classList.add('hidden'); run(); });

}

/* ---- Typ: Block auswählen ---- */
function viewPick(ctx) {
  const t = ctx.t;
  const multi = t.opts.filter(o => o.ok).length > 1;
  question(ctx, t.q, multi ? 'Mehrere Blöcke sind richtig: Klicke alle passenden an und dann auf „Überprüfen“.' : 'Klicke den passenden Block an und dann auf „Überprüfen“.');
  if (t.sc) ctx.body.append(scriptsView(t.sc));
  const grid = el('div', 'opts');
  const items = shuffle(t.opts).map(o => {
    const b = el('button', 'opt'); b.type = 'button';
    b.append(blockOnly(o.b)); grid.append(b);
    return { o, b };
  });
  ctx.body.append(grid);
  const check = mkCheck(ctx, () => {
    items.forEach(({ o, b }) => {
      b.disabled = true;
      const chosen = b.classList.contains('sel');
      b.classList.remove('sel');
      if (o.ok && chosen) b.classList.add('correct');
      else if (o.ok) b.classList.add('missed');
      else if (chosen) b.classList.add('wrong');
    });
    const allRight = items.every(({ o, b }) => o.ok ? b.classList.contains('correct') : !b.classList.contains('wrong'));
    report(ctx, allRight, 'Nicht ganz – grün sind die richtigen Blöcke' + (multi ? ', gestrichelt die, die du übersehen hast.' : '.'));
  });
  items.forEach(({ b }) => b.addEventListener('click', () => {
    if (quiz.done) return;
    if (multi) b.classList.toggle('sel');
    else { items.forEach(x => x.b.classList.remove('sel')); b.classList.add('sel'); }
    check.disabled = !items.some(x => x.b.classList.contains('sel'));
  }));
}

/* ---- Typ: Skripte vergleichen ---- */
function viewCmp(ctx) {
  const t = ctx.t;
  question(ctx, t.q, 'Klicke alle Skripte an, die das Ziel erreichen. Es können mehrere, eines oder auch keines richtig sein. Dann „Überprüfen“.');
  const wrap = el('div', 'cmp');
  const cards = t.scripts.map((s, i) => {
    const c = el('div', 'card pickable');
    c.append(el('h4', null, 'SKRIPT ' + 'ABCD'[i]), scriptEl(s));
    c.addEventListener('click', () => { if (!quiz.done) c.classList.toggle('sel'); });
    wrap.append(c); return c;
  });
  ctx.body.append(wrap);
  const check = mkCheck(ctx, () => {
    let ok = true;
    cards.forEach((c, i) => {
      const want = t.ans.includes(i), got = c.classList.contains('sel');
      c.classList.remove('sel', 'pickable');
      if (want && got) c.classList.add('ok'); else if (want) c.classList.add('missed'); else if (got) c.classList.add('wrong');
      if (want !== got) ok = false;
    });
    const names = t.ans.map(i => 'ABCD'[i]);
    report(ctx, ok, 'Nicht ganz – richtig ' + (names.length ? (names.length > 1 ? 'sind die Skripte ' : 'ist Skript ') + names.join(' und ') : 'ist: keines der Skripte') + '.');
  });
  check.disabled = false;
}

/* ---- Typ: Was passiert? (Antwort auswählen) ---- */
function viewPred(ctx) {
  const t = ctx.t;
  question(ctx, t.q, 'Lies die Skripte von oben nach unten. Wähle eine Antwort und klicke auf „Überprüfen“.');
  ctx.body.append(scriptsView(t.sc));
  const ch = el('div', 'txt-opts');
  const btns = shuffle([...t.good.map(a => ({ a, ok: true })), ...t.bad.map(a => ({ a, ok: false }))]).map(o => {
    const b = el('button', 'txt-opt', o.a); b.type = 'button'; ch.append(b);
    return { o, b };
  });
  ctx.body.append(ch);
  const check = mkCheck(ctx, () => {
    let ok = true;
    btns.forEach(({ o, b }) => {
      b.disabled = true;
      const chosen = b.classList.contains('sel'); b.classList.remove('sel');
      if (o.ok) b.classList.add(chosen ? 'correct' : 'missed');
      else if (chosen) b.classList.add('wrong');
      if (o.ok !== chosen) ok = false;
    });
    report(ctx, ok, 'Leider falsch.');
  });
  btns.forEach(({ b }) => b.addEventListener('click', () => {
    if (quiz.done) return;
    btns.forEach(x => x.b.classList.remove('sel')); b.classList.add('sel'); check.disabled = false;
  }));
}

/* ---- Typ: Zahl eingeben ---- */
function viewNum(ctx) {
  const t = ctx.t;
  question(ctx, t.q, 'Lies das Skript von oben nach unten, rechne und tippe die Zahl ein.');
  ctx.body.append(scriptsView(t.sc));
  const row = el('div', 'num-row');
  const inp = el('input', 'num-in'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = 'Deine Zahl'; inp.autocomplete = 'off';
  row.append(inp);
  if (t.unit) row.append(el('span', 'muted', t.unit));
  ctx.body.append(row);
  const check = mkCheck(ctx, () => {
    const v = parseFloat(inp.value.trim().replace(',', '.'));
    const ok = Math.abs(v - t.ans) < 1e-9;
    inp.disabled = true; inp.classList.add(ok ? 'good' : 'bad');
    report(ctx, ok, 'Leider falsch – richtig ist ' + String(t.ans).replace('.', ',') + (t.unit ? ' ' + t.unit : '') + '.');
  });
  inp.addEventListener('input', () => { check.disabled = !inp.value.trim() || isNaN(parseFloat(inp.value.trim().replace(',', '.'))); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check.click(); });
  ctx.after = () => inp.focus({ preventScroll: true });
}

/* ---- Typ: Fehler finden (Block im Skript anklicken) ---- */
function viewFind(ctx) {
  const t = ctx.t;
  question(ctx, t.q, 'Klicke direkt auf den Block im Skript (bei mehreren Fehlern auf alle) und dann auf „Überprüfen“.');
  const w = scriptsView(t.sc); w.classList.add('findable');
  ctx.body.append(w);
  const check = mkCheck(ctx, () => {
    let ok = true;
    w.querySelectorAll('.blk').forEach(b => {
      if (!b._inst) return;
      const bug = !!b._inst.bug, got = b.classList.contains('picked');
      b.classList.remove('picked');
      if (bug && got) b.classList.add('good'); else if (bug) b.classList.add('missed'); else if (got) b.classList.add('wrong');
      if (bug !== got) ok = false;
    });
    w.classList.remove('findable');
    report(ctx, ok, 'Nicht ganz – grün markiert ist der fehlerhafte Block.');
  });
  w.addEventListener('click', e => {
    if (quiz.done) return;
    const b = e.target.closest('.blk');
    if (!b || !b._inst) return;
    b.classList.toggle('picked');
    check.disabled = !w.querySelector('.blk.picked');
  });
}

/* ---- Typ: Skript bauen ---- */
function normVal(x) { return String(x).trim().toLowerCase().replace(',', '.'); }
function sameList(a, b) {
  if (a.length !== b.length) return false;
  return a.every((x, i) => sameInst(x, b[i]));
}
function sameInst(a, b) {
  if (a.id !== b.id || a.v.length !== b.v.length || a.m.length !== b.m.length) return false;
  for (let i = 0; i < a.v.length; i++) {
    const x = a.v[i], y = b.v[i];
    if (isInst(x) || isInst(y)) { if (!(isInst(x) && isInst(y) && sameInst(x, y))) return false; }
    else if (y !== '*' && normVal(x) !== normVal(y)) return false;
  }
  return a.m.every((l, i) => sameList(l, b.m[i]));
}
function findOwner(list, target) {
  for (let i = 0; i < list.length; i++) {
    const b = list[i];
    if (b === target) return { list, idx: i };
    for (const ml of b.m) { const r = findOwner(ml, target); if (r) return r; }
    const r = findInVals(b, target); if (r) return r;
  }
  return null;
}
function findInVals(b, target) {
  for (let k = 0; k < b.v.length; k++) {
    const x = b.v[k];
    if (!isInst(x)) continue;
    if (x === target) return { inst: b, vi: k };
    const r = findInVals(x, target); if (r) return r;
  }
  return null;
}

function viewBuild(ctx) {
  const t = ctx.t;
  question(ctx, t.q, 'Ziehe Blöcke aus dem Vorrat in die Skript-Fläche. Du kannst jeden Block mehrfach nehmen. Es sind auch Blöcke dabei, die du nicht brauchst. Zahlen und Dropdowns passt du im Skript an.');
  const wrap = el('div', 'build draggable');
  const left = el('div'), right = el('div');
  left.append(el('h4', null, 'Vorrat'));
  const pal = el('div', 'palette');
  shuffle(t.pal).forEach(b => pal.append(renderBlock(b, {})));
  left.append(pal);
  right.append(el('h4', null, 'Dein Skript'));
  const ws = el('div', 'ws');
  right.append(ws);
  wrap.append(left, right);
  ctx.body.append(wrap);

  bs = { root: [], ws, t, ctx, ctxR: null, done: false, check: null };
  const check = el('button', 'primary-btn', 'Überprüfen'); check.type = 'button'; check.disabled = true;
  const reset = el('button', 'secondary-btn', '↺ Zurücksetzen'); reset.type = 'button';
  bs.check = check;
  reset.addEventListener('click', () => { if (bs.done) return; bs.root.length = 0; renderWs(); });
  check.addEventListener('click', () => {
    if (bs.done) return;
    bs.done = true; ws.classList.add('done');
    check.classList.add('hidden'); reset.classList.add('hidden');
    const ok = sameList(bs.root, t.sol);
    report(ctx, ok, 'Das passt noch nicht ganz.', fb => {
      if (ok) return;
      fb.append(el('div', 'sol-label', 'So sieht die Lösung aus'));
      fb.append(scriptEl(t.sol));
    });
  });
  ctx.actions.prepend(check, reset);
  wrap.addEventListener('pointerdown', onDragStart);
  ctx.after = renderWs;
}

function renderWs() {
  const ws = bs.ws;
  ws.textContent = '';
  const c = { edit: !bs.done, lists: [], slots: [], onChange: () => layout(ws) };
  bs.ctxR = c;
  const root = el('div', 'list root');
  c.lists.push({ el: root, arr: bs.root, root: true });
  bs.root.forEach(b => root.append(renderBlock(b, c)));
  ws.append(root);
  if (!bs.root.length) ws.append(el('div', 'placeholder', 'Ziehe hier die Blöcke hinein'));
  layout(ws);
  bs.check.disabled = !bs.root.length;
}

/* ---- Drag & Drop ---- */
let drag = null;
let dropInd = null;
function onDragStart(ev) {
  if (!bs || bs.done || drag) return;
  if (ev.button !== undefined && ev.button !== 0) return;
  if (ev.target.closest('input,select')) return;
  if (ev.target.classList.contains('mouth')) return;
  const be = ev.target.closest('.blk');
  if (!be || !be._inst) return;
  ev.preventDefault();
  const r = be.getBoundingClientRect();
  const fromPalette = !!be.closest('.palette');
  let chain;
  if (fromPalette) chain = [clone(be._inst)];
  else {
    const o = findOwner(bs.root, be._inst);
    if (!o) return;
    if (o.list) chain = o.list.splice(o.idx);
    else { chain = [be._inst]; const ip = inputParts(L[o.inst.id])[o.vi]; o.inst.v[o.vi] = defaultOf(ip); }
    renderWs();
  }
  const g = el('div', 'ghost list');
  chain.forEach(b => g.append(renderBlock(b, {})));
  document.body.append(g);
  layout(g);
  drag = { chain, g, dx: ev.clientX - r.left, dy: ev.clientY - r.top };
  moveGhost(ev);
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
}
function moveGhost(ev) { drag.g.style.left = (ev.clientX - drag.dx) + 'px'; drag.g.style.top = (ev.clientY - drag.dy) + 'px'; }
function onDragMove(ev) { moveGhost(ev); showIndicator(findTarget(ev.clientX, ev.clientY)); }
function onDragEnd(ev) {
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  const tg = ev.type === 'pointercancel' ? null : findTarget(ev.clientX, ev.clientY);
  drag.g.remove(); showIndicator(null);
  if (tg && tg.kind === 'slot') tg.slot.inst.v[tg.slot.idx] = drag.chain[0];
  else if (tg && tg.kind === 'list') tg.arr.splice(tg.idx, 0, ...drag.chain);
  drag = null;
  if (bs) renderWs();
}
function inside(r, x, y, m) { return x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m; }
function findTarget(x, y) {
  const first = drag.chain[0], shape = L[first.id].shape, c = bs.ctxR;
  if (shape === 'reporter' || shape === 'bool') {
    let best = null, ba = Infinity;
    for (const s of c.slots) {
      if (shape === 'reporter' && s.kind === 'b') continue;
      const r = s.el.getBoundingClientRect();
      if (inside(r, x, y, 6)) { const a = r.width * r.height; if (a < ba) { ba = a; best = { kind: 'slot', slot: s, rect: r }; } }
    }
    return best;
  }
  let best = null, ba = Infinity;
  for (const l of c.lists) {
    if (shape === 'hat' && !l.root) continue;
    const r = l.el.getBoundingClientRect();
    if (!inside(l.root ? bs.ws.getBoundingClientRect() : r, x, y, l.root ? 0 : 4)) continue;
    const a = r.width * r.height;
    if (l.root || a < ba) { if (!best || !l.root) { ba = l.root ? Infinity : a; best = l; } }
  }
  if (!best) return null;
  const kids = [...best.el.children].filter(k => k.classList.contains('blk'));
  let idx = kids.filter(k => { const r = k.getBoundingClientRect(); return y > r.top + Math.min(r.height / 2, 24); }).length;
  if (best.root) {
    const firstIsHat = bs.root.length && L[bs.root[0].id].shape === 'hat';
    if (shape === 'hat') idx = 0; else if (firstIsHat) idx = Math.max(idx, 1);
  }
  const lr = best.el.getBoundingClientRect();
  let top, left = lr.left, width = Math.max(60, Math.min(lr.width, 160));
  if (kids[idx]) { const r = kids[idx].getBoundingClientRect(); top = r.top; left = r.left; width = Math.max(60, Math.min(r.width, 160)); }
  else if (kids.length) { const r = kids[kids.length - 1].getBoundingClientRect(); top = r.bottom; left = r.left; width = Math.max(60, Math.min(r.width, 160)); }
  else top = lr.top + (best.root ? 0 : 2);
  return { kind: 'list', arr: best.arr, idx, line: { left, top: top - 3, width } };
}
function showIndicator(tg) {
  if (!dropInd) { dropInd = el('div', 'dropind'); document.body.append(dropInd); }
  if (!tg) { dropInd.style.display = 'none'; return; }
  dropInd.style.display = 'block';
  if (tg.kind === 'slot') {
    const r = tg.rect; dropInd.className = 'dropind box';
    Object.assign(dropInd.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  } else {
    dropInd.className = 'dropind line';
    Object.assign(dropInd.style, { left: tg.line.left + 'px', top: tg.line.top + 'px', width: tg.line.width + 'px', height: '6px' });
  }
}

/* ================= Ende ================= */
function showEnd() {
  quiz.finished = true;
  renderStats();
  app.textContent = '';
  const p = el('section', 'panel completion');
  const pct = quiz.right / quiz.tasks.length;
  p.append(el('div', 'pop', pct >= .9 ? '🏆' : pct >= .6 ? '🎉' : '💪'));
  p.append(el('h2', null, pct >= .9 ? 'Scratch-Profi!' : pct >= .6 ? 'Sehr gut gemacht!' : 'Weiter üben lohnt sich!'));
  p.append(el('div', 'score', quiz.right + '/' + quiz.tasks.length));
  p.append(el('p', 'muted', quiz.score + ' Punkte gesammelt'));
  const bars = el('div', 'bars');
  Object.keys(CATS).forEach(k => {
    const rs = quiz.results.filter(r => r.cat === k);
    if (!rs.length) return;
    const ok = rs.filter(r => r.ok).length;
    const row = el('div', 'bar-row');
    const tr = el('div', 'bar-track'), f = el('div', 'bar-fill');
    f.style.width = (ok / rs.length * 100) + '%'; f.style.setProperty('--bar', CATS[k].c);
    tr.append(f);
    row.append(el('span', null, CATS[k].n), tr, el('span', 'muted', ok + '/' + rs.length));
    bars.append(row);
  });
  p.append(bars);
  const row = el('div', 'action-row'); row.style.justifyContent = 'center';
  const again = el('button', 'primary-btn', 'Noch eine Runde'); again.type = 'button'; again.addEventListener('click', startQuiz);
  const other = el('button', 'secondary-btn', 'Anderes Thema'); other.type = 'button'; other.addEventListener('click', showSetup);
  row.append(again, other); p.append(row);
  app.append(p);
}

/* ================= Bausteine ansehen & einschätzen ================= */
let refOrder = [];
function showReference() {
  app.textContent = '';
  const p = el('section', 'panel');
  p.append(el('h2', null, 'Bausteine-Übersicht'));
  p.append(el('p', 'muted', 'Klicke auf einen Block: Du erfährst, was er macht, und kannst dich einschätzen. Danach kannst du im Quiz gezielt das üben, was noch nicht sitzt.'));
  const sum = el('div', 'legend'); p.append(sum);
  refOrder = [];
  Object.keys(CATS).forEach(k => {
    const sec = el('div', 'ov-cat');
    const h = el('h3'); const dot = el('span', 'dot'); dot.style.background = CATS[k].c; h.append(dot, CATS[k].n);
    sec.append(h);
    const grid = el('div', 'ov-grid');
    Object.values(L).filter(d => d.cat === k).forEach(d => {
      refOrder.push(d.id);
      const b = el('button', 'ov-item'); b.type = 'button'; b.dataset.id = d.id;
      b.append(renderBlock(K(d.id), {}), el('span', 'badge'));
      b.addEventListener('click', () => openSheet(d.id));
      grid.append(b);
    });
    sec.append(grid); p.append(sec);
  });
  const reset = el('button', 'secondary-btn', 'Einschätzung zurücksetzen'); reset.type = 'button'; reset.style.marginTop = '22px';
  reset.addEventListener('click', () => { if (confirm('Alle Einschätzungen löschen?')) { rating = {}; saveRating(); closeSheet(); paintRatings(); } });
  p.append(reset);
  app.append(p);
  layout(app);
  paintRatings();
}
function paintRatings() {
  document.querySelectorAll('.ov-item').forEach(b => {
    const l = LEVELS.find(x => x[0] === levelOf(b.dataset.id));
    const bd = b.querySelector('.badge');
    bd.textContent = l[0] === 'new' ? '' : l[1];
    b.title = l[2];
  });
  const sum = document.querySelector('.legend');
  if (sum) {
    sum.textContent = '';
    LEVELS.forEach(([k, emoji, name]) => {
      const n = refOrder.filter(id => levelOf(id) === k).length;
      const s = el('span', 'stat'); s.append(emoji + ' ' + name + ' ', el('strong', null, String(n))); sum.append(s);
    });
  }
}
function openSheet(id) {
  closeSheet();
  const d = L[id];
  const s = el('div', 'sheet');
  const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Schließen'); x.addEventListener('click', closeSheet);
  const tag = el('div', 'tag', CATS[d.cat].n); tag.style.color = CATS[d.cat].c3;
  const inner = el('div', 'list'); inner.append(renderBlock(K(d.id), {}));
  s.append(x, tag, inner, el('p', null, d.d));
  s.append(el('div', 'sel-label', 'Wie gut kannst du diesen Baustein?'));
  const row = el('div', 'rate-row');
  LEVELS.filter(l => l[0] !== 'new').forEach(([k, emoji, name, color]) => {
    const b = el('button', 'rate-btn', emoji + ' ' + name); b.type = 'button';
    b.setAttribute('aria-pressed', levelOf(id) === k);
    b.addEventListener('click', () => {
      if (levelOf(id) === k) delete rating[id]; else rating[id] = k;
      saveRating(); paintRatings();
      row.querySelectorAll('.rate-btn').forEach((r, i) => r.setAttribute('aria-pressed', levelOf(id) === ['no', 'mid', 'yes'][i]));
    });
    row.append(b);
  });
  s.append(row);
  const nav = el('div', 'rate-row');
  const i = refOrder.indexOf(id);
  const prev = el('button', 'secondary-btn', '‹ Zurück'); prev.type = 'button'; prev.disabled = i <= 0;
  const next = el('button', 'secondary-btn', 'Weiter ›'); next.type = 'button'; next.disabled = i >= refOrder.length - 1;
  prev.addEventListener('click', () => openSheet(refOrder[i - 1]));
  next.addEventListener('click', () => openSheet(refOrder[i + 1]));
  nav.append(prev, next); s.append(nav);
  document.body.append(s); sheetEl = s;
  layout(s);
  const it = document.querySelector('.ov-item[data-id="' + id + '"]');
  if (it) { it.classList.add('active'); it.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } document.querySelectorAll('.ov-item.active').forEach(x => x.classList.remove('active')); }

showReference();
</script>
